<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Browser Agent</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #38bdf8;
        --success: #22c55e;
        --warning: #fbbf24;
        --danger: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        width: 380px;
        min-height: 500px;
        padding: 16px;
      }

      .title {
        margin: 0 0 12px;
        font-size: 20px;
      }

      .section {
        background: var(--panel-soft);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }

      label {
        display: block;
        font-size: 12px;
        margin-bottom: 8px;
        color: var(--muted);
      }

      textarea {
        width: 100%;
        min-height: 80px;
        resize: vertical;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #0b1220;
        color: var(--text);
        padding: 10px;
        font-size: 13px;
      }

      button {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #082f49;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #374151;
        color: var(--text);
      }

      .status {
        margin-top: 12px;
        min-height: 24px;
        font-size: 12px;
        color: var(--muted);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.7);
        padding: 8px 10px;
      }

      .status.success {
        color: var(--success);
      }

      .status.error {
        color: var(--danger);
      }

      .status.warning {
        color: var(--warning);
      }

      .meta {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.4;
      }

      .output-label {
        display: block;
        margin: 10px 0 8px;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .action-output {
        margin-top: 0;
        padding: 10px;
        border-radius: 8px;
        background: #0b1220;
        border: 1px solid #334155;
        font-size: 12px;
        color: var(--muted);
        white-space: pre-wrap;
        min-height: 110px;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Privacy Browser Agent</h1>

    <div class="section">
      <label for="instruction">User instruction</label>
      <textarea id="instruction" placeholder="Example: Find the upload button and click it.">Find the upload button and click it.</textarea>
    </div>

    <div class="section">
      <button id="analyze-btn">Analyze page</button>
      <button id="execute-btn" class="secondary" style="margin-top: 8px;">Run last action</button>
    </div>

    <div class="section">
      <label class="output-label">Status</label>
      <div id="status" class="status">Ready.</div>
    </div>

    <div class="section">
      <label class="output-label">Last returned action</label>
      <div id="action-output" class="action-output">No action loaded yet.</div>
    </div>

    <div class="section meta">
      This extension captures the active page, sanitizes sensitive content locally, and sends only safe context to the server.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
